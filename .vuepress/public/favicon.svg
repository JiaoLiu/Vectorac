<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vectorac">
  <defs>
    <style>
      .mark-stroke { stroke: #202123; }
      .mark-fill { fill: #202123; }
    </style>
    <mask id="arrow-through-v" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#FFF"/>
      <path d="m17.3 27 4.7 12h11L29 27Z" fill="#000"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="#F7F7F5"/>

  <!-- A true outlined ribbon: both edges of the V are visible and the body stays hollow. -->
  <path class="mark-stroke" d="M13 13h10l9 26 9-26h10L37 49.2c-.8 2.5-2.6 3.8-5 3.8s-4.2-1.3-5-3.8L13 13Z" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A closed, streamlined fletching leaves clear air before the V. -->
  <g mask="url(#arrow-through-v)">
    <g class="mark-stroke" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 32h49"/>
      <path d="M7 28.5h3.5c2.4 0 4.3.9 5.5 2.5v2c-1.2 1.6-3.1 2.5-5.5 2.5H7l-1.5-3.5L7 28.5Z"/>
      <path d="m8 28.8 3.2 3.2M11 28.7l3.2 3.3M8 35.2l3.2-3.2M11 35.3l3.2-3.3" stroke-width="1.25"/>
    </g>
    <!-- A short, narrow spear point replaces the oversized equilateral arrowhead. -->
    <path class="mark-fill" d="m49 28.8 10 3.2-10 3.2 2.5-3.2-2.5-3.2Z"/>
  </g>
</svg>
