# 联机麻将服务 nginx 反代配置（合并进主域名 server 块方案）
# 用法：把下面的 location 块手动合并到 vectorac.com 主 server { } 里
#
# 不放 conf.d/ —— location 指令必须在 server 块内（直接放 conf.d/ 会报
#   "location directive is not allowed here"）
#
# 部署方法（手动）：
#   1. sudo vim /etc/nginx/conf.d/vectorac.conf   （或 sites-enabled 下的主配置）
#   2. 在 vectorac.com 的 server { } 块末尾添加下面三个 location
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 访问模型（与官网同源，前端代码不需要区分环境）：
#   房间列表/创建/加入：https://vectorac.com/api/rooms
#   后台统计：          https://vectorac.com/api/game-stats
#   WebSocket：         wss://vectorac.com/mahjong-ws
#
# 服务默认只监听 127.0.0.1:3032（见 .env / config.js）。

# ---- 房间列表 / 创建 / 加入（HTTP）----
location /api/rooms {
    proxy_pass http://127.0.0.1:3032;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 后台统计（HTTP，需 X-Admin-Token）----
location = /api/game-stats {
    proxy_pass http://127.0.0.1:3032;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 房间实时同步（WebSocket）----
# 关键：必须转发 Upgrade / Connection，否则握手失败（浏览器收到 400/426）
location = /mahjong-ws {
    proxy_pass http://127.0.0.1:3032;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 牌局是长连接：服务端每 30s 发一次 ping；这里放大超时避免误断
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}