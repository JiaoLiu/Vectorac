# 联机麻将服务 nginx 反代配置（include 方案）
# 用法：在 vectorac.com 主 server { } 里加一行 include 引用本文件（也可以手工粘贴下面的块）
#
# 不放 conf.d/ 独立目录 —— location 指令必须在 server 块内（直接放 conf.d/ 会报
#   "location directive is not allowed here"）；用 include 不违反这条限制，
#   因为三段 location 仍然处于 server 块作用域内。
#
# 部署方法（在服务器上）：
#   1. 在 vectorac.com 的 server { }（443/ssl 那个块）里加：
#        include /home/www/vectorac/mahjong-service/scripts/mahjong-proxy.conf;
#      （README.md「部署到 vectorac.com / nginx」章节有自动插入 + 校验脚本）
#   2. sudo nginx -t && sudo systemctl reload nginx
#
# 以后调整反代只改本文件再 reload 即可，不用再碰 /etc/nginx/conf.d/vectorac.conf。
#
# 访问模型（与官网同源，前端代码不需要区分环境）：
#   房间列表/创建/加入：https://vectorac.com/api/rooms
#   后台统计：          https://vectorac.com/api/game-stats
#   WebSocket：         wss://vectorac.com/mahjong-ws
#
# 服务默认只监听 127.0.0.1:3032（见 .env / config.js）。

# ---- 房间列表 / 创建 / 加入（HTTP）----
location /api/rooms {
    proxy_pass http://127.0.0.1:3032;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 后台统计（HTTP，需 X-Admin-Token）----
location = /api/game-stats {
    proxy_pass http://127.0.0.1:3032;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 房间实时同步（WebSocket）----
# 关键：必须转发 Upgrade / Connection，否则握手失败（浏览器收到 400/426）
location = /mahjong-ws {
    proxy_pass http://127.0.0.1:3032;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 牌局是长连接：服务端每 30s 发一次 ping；这里放大超时避免误断
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}