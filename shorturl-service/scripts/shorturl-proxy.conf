# 短链服务 nginx 反代配置
# 直接放入 /etc/nginx/conf.d/ 即可生效
# sudo cp shorturl-proxy.conf /etc/nginx/conf.d/shorturl.conf
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name s.vectorac.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s.vectorac.com;

    # 证书由 certbot 自动签发，路径指向 letsencrypt 目录
    ssl_certificate     /etc/letsencrypt/live/vectorac.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vectorac.com/privkey.pem;

    # favicon 反代到主站，复用 vectorac.com 的静态资源
    location = /favicon.svg {
        proxy_pass https://vectorac.com/favicon.svg;
        proxy_set_header Host vectorac.com;
        proxy_ssl_server_name on;
    }
    location = /favicon.ico {
        proxy_pass https://vectorac.com/favicon.ico;
        proxy_set_header Host vectorac.com;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}