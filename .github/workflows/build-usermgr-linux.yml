name: Build usermgr Linux x64 package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: rockylinux:8
    timeout-minutes: 15

    steps:
      - name: Install build tools and Node.js
        run: |
          dnf install -y git curl xz tar gzip file binutils make python3.11 \
            gcc-toolset-13-gcc gcc-toolset-13-gcc-c++
          curl -fsSLO https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz
          tar -xJf node-v22.22.0-linux-x64.tar.xz -C /usr/local --strip-components=1
          node --version
          npm --version

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux production dependencies
        working-directory: usermgr-service
        env:
          PYTHON: /usr/bin/python3.11
          CC: /opt/rh/gcc-toolset-13/root/usr/bin/gcc
          CXX: /opt/rh/gcc-toolset-13/root/usr/bin/g++
          npm_config_build_from_source: "true"
        run: |
          "$CXX" --version
          npm ci --omit=dev --no-audit --no-fund

      - name: Build @alicloud/dysmsapi20170525 (npm package missing dist)
        working-directory: usermgr-service
        run: |
          if [ ! -f node_modules/@alicloud/dysmsapi20170525/dist/client.js ]; then
            echo "dist/client.js missing, compiling from src..."
            cd node_modules/@alicloud/dysmsapi20170525
            npm install --no-save typescript@5
            cat > tsconfig.json <<'TC'
          {
            "compilerOptions": {
              "target": "ES2018",
              "module": "CommonJS",
              "declaration": true,
              "outDir": "./dist",
              "rootDir": "./src",
              "strict": false,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "resolveJsonModule": true
            },
            "include": ["src/**/*"]
          }
          TC
            npx tsc
            test -f dist/client.js && echo "dist/client.js OK"
          else
            echo "dist/client.js already exists"
          fi

      - name: Verify native module
        working-directory: usermgr-service
        run: |
          node -e "const D=require('better-sqlite3'); const db=new D(':memory:'); console.log(db.prepare('select sqlite_version() version').get()); db.close()"
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node
          file node_modules/better-sqlite3/build/Release/better_sqlite3.node | grep -q 'ELF 64-bit.*x86-64'
          MAX_GLIBC="$(objdump -T node_modules/better-sqlite3/build/Release/better_sqlite3.node \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          printf 'Maximum required glibc: %s\n' "$MAX_GLIBC"
          test "$(printf '%s\n' "$MAX_GLIBC" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28

      - name: Audit public routes
        working-directory: usermgr-service
        run: node scripts/check-public-routes.js

      - name: Create deployment archive
        run: |
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          mkdir -p package/usermgr-service
          cp -a usermgr-service/server.js usermgr-service/db.js usermgr-service/volcano.js \
            usermgr-service/captcha.js \
            usermgr-service/package.json usermgr-service/package-lock.json usermgr-service/README.md \
            usermgr-service/public usermgr-service/scripts usermgr-service/docs usermgr-service/node_modules \
            package/usermgr-service/
          tar -czf "usermgr-service-linux-x64-${SHORT_SHA}.tar.gz" -C package usermgr-service

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: usermgr-service-linux-x64-${{ github.sha }}
          path: usermgr-service-linux-x64-*.tar.gz
          if-no-files-found: error
          retention-days: 14
