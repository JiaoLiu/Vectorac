<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>众神斗法 · 封面合成</title>
<style>
  @font-face{font-family:'msz';src:url('/assets/fonts/msz.woff2') format('woff2')}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:675px;overflow:hidden;background:#0a0d14}
  .stage{position:relative;width:1200px;height:675px;overflow:hidden}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.52) saturate(1.15)}
  .shade{position:absolute;inset:0;background:
    radial-gradient(ellipse 60% 55% at 50% 48%,rgba(255,196,80,.20),transparent 60%),
    linear-gradient(180deg,rgba(4,6,12,.55),transparent 30%,transparent 62%,rgba(4,6,12,.82)),
    radial-gradient(ellipse 120% 100% at 50% 50%,transparent 55%,rgba(2,3,8,.55) 100%)}
  .beam{position:absolute;left:40px;right:40px;top:336px;height:5px;border-radius:3px;
    background:linear-gradient(90deg,transparent,rgba(255,214,120,.15) 18%,rgba(255,224,150,.95) 50%,rgba(255,214,120,.15) 82%,transparent);
    filter:blur(1px);box-shadow:0 0 26px 6px rgba(255,200,90,.5)}
  .streak{position:absolute;width:460px;height:3px;border-radius:2px;filter:blur(.8px);opacity:.85}
  .streak.l{left:120px;top:300px;transform:rotate(-14deg);background:linear-gradient(90deg,transparent,rgba(255,226,160,.9));box-shadow:0 0 14px 2px rgba(255,205,100,.55)}
  .streak.r{right:120px;top:372px;transform:rotate(-14deg);background:linear-gradient(90deg,rgba(255,226,160,.9),transparent);box-shadow:0 0 14px 2px rgba(255,205,100,.55)}
  .card{position:absolute;width:180px;height:270px;border-radius:12px;overflow:hidden;
    box-shadow:0 14px 34px rgba(0,0,0,.62),0 0 0 2px var(--edge),0 0 18px var(--rim)}
  .card img{width:100%;height:100%;object-fit:cover;object-position:center 16%;display:block}
  .card .tag{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 7px;text-align:center;
    background:linear-gradient(180deg,transparent,rgba(5,4,2,.86) 62%);
    font-family:'msz',serif;font-size:25px;line-height:1;color:#f3e3b6;text-shadow:0 2px 6px #000,0 0 12px rgba(255,205,100,.35)}
  .left{--edge:rgba(226,186,98,.95);--rim:rgba(255,205,100,.28)}
  .right{--edge:rgba(196,84,58,.95);--rim:rgba(255,110,60,.26)}
  .duel{position:absolute;width:224px;height:336px;left:488px;top:162px;border-radius:14px;overflow:hidden;z-index:10;
    box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 0 3px rgba(255,214,130,.98),0 0 60px 14px rgba(255,196,80,.62)}
  .duel img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
  .duel .tag{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 9px;text-align:center;
    background:linear-gradient(180deg,transparent,rgba(5,4,2,.88) 60%);
    font-family:'msz',serif;font-size:34px;color:#ffe9b8;text-shadow:0 2px 8px #000,0 0 18px rgba(255,205,100,.6)}
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="/assets/heavenly-arena.jpg" alt="">
  <div class="shade"></div>
  <div class="beam"></div>
  <div class="streak l"></div>
  <div class="streak r"></div>

  <div class="card left" style="left:52px;top:252px;transform:rotate(-8deg) scale(.94)"><img src="/assets/heroes/jinling.jpg" alt=""><div class="tag">金灵圣母</div></div>
  <div class="card left" style="left:182px;top:218px;transform:rotate(-3deg) scale(.97)"><img src="/assets/heroes/yangjian.jpg" alt=""><div class="tag">杨戬</div></div>
  <div class="card left" style="left:312px;top:196px;transform:rotate(3deg)"><img src="/assets/heroes/nezha.jpg" alt=""><div class="tag">哪吒</div></div>

  <div class="card right" style="right:52px;top:252px;transform:rotate(8deg) scale(.94)"><img src="/assets/heroes/isis.jpg" alt=""><div class="tag">伊西斯</div></div>
  <div class="card right" style="right:182px;top:218px;transform:rotate(3deg) scale(.97)"><img src="/assets/heroes/kongxuan.jpg" alt=""><div class="tag">孔宣</div></div>
  <div class="card right" style="right:312px;top:196px;transform:rotate(-3deg)"><img src="/assets/heroes/dixin.jpg" alt=""><div class="tag">帝辛</div></div>

  <div class="duel"><img src="/assets/cards/duel.jpg" alt=""><div class="tag">斗法</div></div>
</div>
</body>
</html>
