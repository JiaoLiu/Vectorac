# usermgr-service nginx 反代配置（合并进主域名 server 块方案）
# 用法：把下面两个 location 块手动合并到 vectorac.com 主 server { } 里
#
# 不再单独放 conf.d/ —— location 指令必须在 server 块内（直接放 conf.d/ 会报
#   "location directive is not allowed here"）
#
# 部署方法（手动）：
#   1. sudo vim /etc/nginx/conf.d/vectorac.conf   （或 /etc/nginx/sites-enabled/ 下的主配置）
#   2. 在 vectorac.com 的 server { } 块末尾添加下面三个 location
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 访问模型：
#   全局管理平台：https://vectorac.com/admin/
#   全局管理 API：https://vectorac.com/admin/api/
#   产品用户端：https://vectorac.com/<product>/account/
#   产品/设备 API：https://vectorac.com/<product>/api/

# ---- 全局管理平台及管理 API ----
location = /admin {
    return 301 /admin/;
}

location /admin/ {
    proxy_pass http://127.0.0.1:3031/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 多产品用户页面及 API（xiaov 只是 product code 之一）----
location ~ ^/([a-z][a-z0-9_]{1,30})/(account|api)(/.*)?$ {
    proxy_pass http://127.0.0.1:3031;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 设备轮询可能慢，延长超时
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# 兼容曾短暂使用过的旧管理地址
location = /xiaov/admin {
    return 301 /admin/;
}

location /xiaov/admin/ {
    return 301 /admin/;
}
