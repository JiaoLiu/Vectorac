# usermgr-service nginx 反代配置（合并进主域名 server 块方案）
# 用法：把下面两个 location 块手动合并到 vectorac.com 主 server { } 里
#
# 不再单独放 conf.d/ —— location 指令必须在 server 块内（直接放 conf.d/ 会报
#   "location directive is not allowed here"）
#
# 部署方法（手动）：
#   1. sudo vim /etc/nginx/conf.d/vectorac.conf   （或 /etc/nginx/sites-enabled/ 下的主配置）
#   2. 在 vectorac.com 的 server { } 块末尾添加下面三个 location
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 访问：
#   用户端：   https://vectorac.com/xiaov/account/
#   用户 API： https://vectorac.com/xiaov/api/
#   管理后台：https://vectorac.com/xiaov/admin/ （密码已强，不再 IP 白名单）

# ---- 用户前台静态文件 ----
location /xiaov/account/ {
    alias /home/www/vectorac/usermgr-service/public/account/;
    try_files $uri $uri/ /xiaov/account/index.html;

    # 静态资源缓存
    location ~* \.(css|js|png|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}

# ---- 用户 API 反代 ----
location /xiaov/api/ {
    proxy_pass http://127.0.0.1:3031;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 设备轮询可能慢，延长超时
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# ---- 管理后台（走 nginx + 域名；强密码鉴权，无 IP 白名单）----
location /xiaov/admin/ {
    proxy_pass http://127.0.0.1:3031/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
