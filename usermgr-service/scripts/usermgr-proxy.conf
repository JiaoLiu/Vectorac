# nginx 反代配置：usermgr-service
# 用法：
#   sudo cp /home/www/vectorac/usermgr-service/scripts/usermgr-proxy.conf /etc/nginx/conf.d/usermgr.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 配置说明：
#   - vectorac.com/xiaov/account/*  → 静态 SPA
#   - vectorac.com/xiaov/api/*      → 反代 127.0.0.1:3031
#   - 管理后台不走 nginx，直接用 http://<IP>:3031/admin/ 访问
#
# 把下面两个 location 块合并进 vectorac.com 的 server { } 里
# （通常在 /etc/nginx/conf.d/vectorac.conf 或类似文件）

# ---- 用户前台静态文件 ----
location /xiaov/account/ {
  alias /home/www/vectorac/usermgr-service/public/account/;
  try_files $uri $uri/ /xiaov/account/index.html;

  # 静态资源缓存
  location ~* \.(css|js|png|svg|ico|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }
}

# ---- 用户 API 反代 ----
location /xiaov/api/ {
  proxy_pass http://127.0.0.1:3031;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 设备轮询可能慢，延长超时
  proxy_read_timeout 60s;
  proxy_write_timeout 60s;
}

# ---- 管理后台（可选：如果想让管理后台也走 nginx + 域名，取消注释）----
